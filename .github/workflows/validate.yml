name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q custom_components
      - name: Validate JSON metadata
        run: python -m json.tool custom_components/wallpanel_photo_selector/manifest.json >/dev/null && python -m json.tool hacs.json >/dev/null
      - name: Test anonymous visitor memory and matching
        run: |
          python -m pip install numpy==1.26.4
          PYTHONPATH=recognition python -m unittest discover -s recognition/tests -p test_matching.py -v
